<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f2a1f">
<title>Padel Turnier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --court-green: #1a3d2e;
    --court-green-dark: #0f2a1f;
    --court-line: #f4f1e8;
    --accent: #ffd23f;
    --accent-glow: #ffe066;
    --danger: #ff4757;
    --text: #f4f1e8;
    --text-muted: #a8b5af;
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(244,241,232,0.12);
  }

  html, body { overscroll-behavior: none; }

  body {
    min-height: 100vh;
    font-family: 'Outfit', sans-serif;
    background:
      radial-gradient(ellipse at top, #1f4d3a 0%, transparent 50%),
      radial-gradient(ellipse at bottom, #0a1f17 0%, transparent 50%),
      var(--court-green-dark);
    color: var(--text);
    padding: 24px 16px 40px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(90deg, transparent 49.5%, rgba(244,241,232,0.03) 49.5%, rgba(244,241,232,0.03) 50.5%, transparent 50.5%),
      linear-gradient(0deg, transparent 49.5%, rgba(244,241,232,0.03) 49.5%, rgba(244,241,232,0.03) 50.5%, transparent 50.5%);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  .container { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }

  header { text-align: center; margin-bottom: 32px; }

  .eyebrow {
    font-family: 'Bebas Neue', sans-serif;
    color: var(--accent);
    letter-spacing: 0.4em;
    font-size: 0.75rem;
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.6rem, 11vw, 5.5rem);
    letter-spacing: 0.04em;
    line-height: 0.95;
    background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    color: var(--text-muted);
    margin-top: 10px;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
  }

  .storage-warning {
    background: rgba(255,71,87,0.1);
    border: 1px solid rgba(255,71,87,0.3);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 20px;
    color: var(--text);
    font-size: 0.8rem;
    text-align: center;
    line-height: 1.5;
  }

  .ranking {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 36px;
  }

  @media (max-width: 640px) {
    .ranking { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  }

  .player-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 16px 12px 14px;
    text-align: center;
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
    transition: transform 0.3s ease, border-color 0.3s ease;
  }

  .player-card.leader {
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(255,210,63,0.12), rgba(255,210,63,0.02));
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(255,210,63,0.15);
  }

  .player-card.leader::before {
    content: "👑";
    position: absolute;
    top: -6px;
    right: 6px;
    font-size: 1.2rem;
  }

  .player-rank {
    font-family: 'Bebas Neue', sans-serif;
    color: var(--text-muted);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
  }

  .player-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.05em;
    margin: 4px 0 6px;
  }

  .player-points {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.6rem;
    color: var(--accent);
    line-height: 1;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .player-points.bump { transform: scale(1.25); }

  .player-points-label {
    color: var(--text-muted);
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .adjust-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
  }

  .adjust-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    -webkit-touch-callout: none;
  }

  .adjust-btn:active { transform: scale(0.9); }

  .adjust-btn.plus:hover, .adjust-btn.plus:active {
    background: rgba(255,210,63,0.2);
    border-color: var(--accent);
    color: var(--accent);
  }

  .adjust-btn.minus:hover, .adjust-btn.minus:active {
    background: rgba(255,71,87,0.15);
    border-color: var(--danger);
    color: var(--danger);
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 0.15em;
  }

  .round { margin-bottom: 28px; }

  .round-label {
    display: inline-block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.25em;
    color: var(--accent);
    padding: 5px 12px;
    border: 1px solid var(--accent);
    border-radius: 20px;
    margin-bottom: 12px;
  }

  .match {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 12px;
    align-items: center;
    transition: border-color 0.3s ease;
    backdrop-filter: blur(10px);
  }

  .match.decided { border-color: rgba(255,210,63,0.3); }

  @media (max-width: 640px) {
    .match {
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 12px;
    }
    .vs { padding: 4px 0; }
  }

  .team {
    background: rgba(255,255,255,0.03);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 14px 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    text-align: center;
    user-select: none;
    min-height: 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .team:active { transform: scale(0.97); }

  .team:hover {
    background: rgba(255,210,63,0.08);
    border-color: rgba(255,210,63,0.4);
  }

  .team.winner {
    background: linear-gradient(135deg, rgba(255,210,63,0.25), rgba(255,210,63,0.08));
    border-color: var(--accent);
    box-shadow: 0 4px 20px rgba(255,210,63,0.2);
  }

  .team.winner::after {
    content: "✓ Sieger";
    display: block;
    font-family: 'Bebas Neue', sans-serif;
    color: var(--accent);
    letter-spacing: 0.2em;
    font-size: 0.7rem;
    margin-top: 4px;
  }

  .team-names {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.15rem;
    letter-spacing: 0.05em;
  }

  .team-hint {
    color: var(--text-muted);
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .vs {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    text-align: center;
  }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 28px;
  }

  button.btn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    padding: 14px 24px;
    border-radius: 30px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text);
    cursor: pointer;
    transition: all 0.25s ease;
    backdrop-filter: blur(10px);
  }

  button.btn:active { transform: scale(0.96); }

  button.btn:hover {
    background: rgba(255,210,63,0.1);
    border-color: var(--accent);
  }

  button.btn.primary {
    background: var(--accent);
    color: var(--court-green-dark);
    border-color: var(--accent);
  }

  button.btn.primary:hover {
    background: var(--accent-glow);
    box-shadow: 0 8px 24px rgba(255,210,63,0.3);
  }

  button.btn.danger:hover {
    background: rgba(255,71,87,0.15);
    border-color: var(--danger);
    color: var(--danger);
  }

  .reset-team {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 0.65rem;
    cursor: pointer;
    margin-top: 4px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 6px;
  }

  .reset-team:hover { color: var(--danger); }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--accent);
    color: var(--court-green-dark);
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 0.15em;
    padding: 12px 24px;
    border-radius: 30px;
    opacity: 0;
    transition: all 0.4s ease;
    z-index: 100;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    font-size: 0.9rem;
    max-width: 90vw;
    text-align: center;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="eyebrow">★ Padel Turnier ★</div>
    <h1>Jeder gegen<br>Jeden</h1>
    <p class="subtitle">Ayoub · Ilias · Anas · Ouail — 90 Minuten Spielzeit</p>
  </header>

  <div id="warning-zone"></div>

  <div class="ranking" id="ranking"></div>

  <div class="section-header">
    <div class="section-title">Spielplan</div>
  </div>
  <div id="rounds"></div>

  <div class="controls">
    <button class="btn primary" id="btn-add-round">+ Neue Runde</button>
    <button class="btn danger" id="btn-reset">Zurücksetzen</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  'use strict';

  const PLAYERS = ['Ayoub', 'Ilias', 'Anas', 'Ouail'];

  const TEAM_COMBOS = [
    { teamA: ['Ayoub', 'Ilias'], teamB: ['Anas', 'Ouail'] },
    { teamA: ['Ayoub', 'Anas'],  teamB: ['Ilias', 'Ouail'] },
    { teamA: ['Ayoub', 'Ouail'], teamB: ['Ilias', 'Anas'] }
  ];

  // Detect if localStorage is actually usable. Some webview/mail-preview
  // environments expose localStorage but throw on any access.
  let storageAvailable = false;
  try {
    const testKey = '__padel_test__';
    window.localStorage.setItem(testKey, '1');
    window.localStorage.removeItem(testKey);
    storageAvailable = true;
  } catch (e) {
    storageAvailable = false;
  }

  function createRound() {
    return TEAM_COMBOS.map(function(c) {
      return { teamA: c.teamA, teamB: c.teamB, winner: null };
    });
  }

  function freshState() {
    const s = { rounds: [createRound()], manualAdjustments: {} };
    PLAYERS.forEach(function(p) { s.manualAdjustments[p] = 0; });
    return s;
  }

  function loadState() {
    if (!storageAvailable) return freshState();
    try {
      const saved = window.localStorage.getItem('padel_state_v2');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (!parsed.manualAdjustments) {
          parsed.manualAdjustments = {};
          PLAYERS.forEach(function(p) { parsed.manualAdjustments[p] = 0; });
        }
        if (!Array.isArray(parsed.rounds) || parsed.rounds.length === 0) {
          parsed.rounds = [createRound()];
        }
        return parsed;
      }
    } catch (e) {
      // fallthrough to fresh
    }
    return freshState();
  }

  function saveState() {
    if (!storageAvailable) return;
    try {
      window.localStorage.setItem('padel_state_v2', JSON.stringify(state));
    } catch (e) {
      // silent
    }
  }

  let state = loadState();

  function calculatePoints() {
    const points = {};
    PLAYERS.forEach(function(p) { points[p] = state.manualAdjustments[p] || 0; });
    state.rounds.forEach(function(round) {
      round.forEach(function(match) {
        if (match.winner === 'A') {
          match.teamA.forEach(function(p) { points[p]++; });
        } else if (match.winner === 'B') {
          match.teamB.forEach(function(p) { points[p]++; });
        }
      });
    });
    PLAYERS.forEach(function(p) { if (points[p] < 0) points[p] = 0; });
    return points;
  }

  function renderWarning() {
    const zone = document.getElementById('warning-zone');
    if (!storageAvailable) {
      zone.innerHTML =
        '<div class="storage-warning">' +
        '⚠️ Speicherung deaktiviert — Ergebnisse gehen beim Schließen verloren.<br>' +
        'Tipp: Datei aus E-Mail herunterladen und in Chrome/Safari öffnen.' +
        '</div>';
    } else {
      zone.innerHTML = '';
    }
  }

  function renderRanking() {
    const points = calculatePoints();
    const sorted = PLAYERS.map(function(name) {
      return { name: name, points: points[name] };
    }).sort(function(a, b) { return b.points - a.points; });
    const maxPts = sorted[0].points;
    const someoneScored = maxPts > 0;

    const container = document.getElementById('ranking');
    const prevPoints = {};
    const existingCards = container.querySelectorAll('.player-card');
    for (let i = 0; i < existingCards.length; i++) {
      prevPoints[existingCards[i].dataset.name] = parseInt(existingCards[i].dataset.points || '0', 10);
    }

    container.innerHTML = sorted.map(function(p, idx) {
      const isLeader = someoneScored && p.points === maxPts;
      return '' +
        '<div class="player-card ' + (isLeader ? 'leader' : '') + '" data-name="' + p.name + '" data-points="' + p.points + '">' +
          '<div class="player-rank">#' + (idx + 1) + '</div>' +
          '<div class="player-name">' + p.name + '</div>' +
          '<div class="player-points" id="pts-' + p.name + '">' + p.points + '</div>' +
          '<div class="player-points-label">Siege</div>' +
          '<div class="adjust-row">' +
            '<button class="adjust-btn minus" data-action="adjust" data-name="' + p.name + '" data-delta="-1" aria-label="Punkt abziehen">−</button>' +
            '<button class="adjust-btn plus" data-action="adjust" data-name="' + p.name + '" data-delta="1" aria-label="Punkt hinzufügen">+</button>' +
          '</div>' +
        '</div>';
    }).join('');

    sorted.forEach(function(p) {
      if (prevPoints[p.name] !== undefined && prevPoints[p.name] !== p.points) {
        const el = document.getElementById('pts-' + p.name);
        if (el) {
          el.classList.add('bump');
          setTimeout(function() { el.classList.remove('bump'); }, 400);
        }
      }
    });
  }

  function renderRounds() {
    const container = document.getElementById('rounds');
    container.innerHTML = state.rounds.map(function(round, ri) {
      return '' +
        '<div class="round">' +
          '<div class="round-label">Runde ' + (ri + 1) + '</div>' +
          round.map(function(match, mi) {
            return '' +
              '<div class="match ' + (match.winner ? 'decided' : '') + '">' +
                '<div class="team ' + (match.winner === 'A' ? 'winner' : '') + '" data-action="winner" data-round="' + ri + '" data-match="' + mi + '" data-team="A">' +
                  '<div class="team-names">' + match.teamA.join(' & ') + '</div>' +
                  (!match.winner ? '<div class="team-hint">Tippen für Sieg</div>' : '') +
                '</div>' +
                '<div class="vs">VS</div>' +
                '<div class="team ' + (match.winner === 'B' ? 'winner' : '') + '" data-action="winner" data-round="' + ri + '" data-match="' + mi + '" data-team="B">' +
                  '<div class="team-names">' + match.teamB.join(' & ') + '</div>' +
                  (!match.winner ? '<div class="team-hint">Tippen für Sieg</div>' : '') +
                '</div>' +
                (match.winner ? '<button class="reset-team" style="grid-column: 1 / -1;" data-action="clear" data-round="' + ri + '" data-match="' + mi + '">↺ Ergebnis löschen</button>' : '') +
              '</div>';
          }).join('') +
        '</div>';
    }).join('');
  }

  function setWinner(roundIdx, matchIdx, team) {
    const match = state.rounds[roundIdx][matchIdx];
    match.winner = (match.winner === team) ? null : team;
    saveState();
    renderAll();
    if (match.winner) {
      const winners = match.winner === 'A' ? match.teamA : match.teamB;
      showToast(winners.join(' & ') + ' +1 Punkt');
    }
  }

  function clearWinner(roundIdx, matchIdx) {
    state.rounds[roundIdx][matchIdx].winner = null;
    saveState();
    renderAll();
  }

  function adjustPoints(name, delta) {
    const currentTotal = calculatePoints()[name];
    if (delta < 0 && currentTotal <= 0) {
      showToast(name + ' hat 0 Punkte');
      return;
    }
    state.manualAdjustments[name] = (state.manualAdjustments[name] || 0) + delta;
    saveState();
    renderAll();
    showToast(name + ' ' + (delta > 0 ? '+' : '') + delta + ' Punkt');
  }

  function addRound() {
    state.rounds.push(createRound());
    saveState();
    renderAll();
    setTimeout(function() {
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }, 100);
  }

  function resetAll() {
    if (confirm('Wirklich alle Ergebnisse löschen?')) {
      state = freshState();
      saveState();
      renderAll();
    }
  }

  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 1500);
  }

  function renderAll() {
    renderWarning();
    renderRanking();
    renderRounds();
  }

  // Event delegation — single listener instead of inline onclick attributes.
  // More robust in restrictive webviews where inline handlers may be stripped.
  document.addEventListener('click', function(e) {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.getAttribute('data-action');
    if (action === 'winner') {
      const ri = parseInt(target.getAttribute('data-round'), 10);
      const mi = parseInt(target.getAttribute('data-match'), 10);
      const team = target.getAttribute('data-team');
      setWinner(ri, mi, team);
    } else if (action === 'clear') {
      e.stopPropagation();
      const ri = parseInt(target.getAttribute('data-round'), 10);
      const mi = parseInt(target.getAttribute('data-match'), 10);
      clearWinner(ri, mi);
    } else if (action === 'adjust') {
      const name = target.getAttribute('data-name');
      const delta = parseInt(target.getAttribute('data-delta'), 10);
      adjustPoints(name, delta);
    }
  });

  document.getElementById('btn-add-round').addEventListener('click', addRound);
  document.getElementById('btn-reset').addEventListener('click', resetAll);

  // Initial render — wrapped in try/catch so a render error doesn't leave
  // the page blank.
  try {
    renderAll();
  } catch (err) {
    document.getElementById('rounds').innerHTML =
      '<div class="storage-warning">Fehler beim Laden: ' + (err && err.message ? err.message : 'unbekannt') + '</div>';
  }
})();
</script>
</body>
</html>
